<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>eSPJ-Kontribusi — Dinas Kesehatan Kab. Kutai Kartanegara</title>
<meta name="description" content="Platform e-SPJ Kontribusi Pelatihan: formulir Data Pelatihan -> 9 dokumen SPJ otomatis format F4. Backend Supabase. Hosting GitHub Pages." />
<style>
/* ============================================================
   eSPJ-Kontribusi (statis) — GitHub Pages + Supabase
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:#f1f5f9;color:#0f172a;font-size:14px}
button{font-family:inherit}

/* ---------- Kerangka aplikasi ---------- */
.app-shell{min-height:100vh;display:flex;flex-direction:column}
.app-header{background:#065f46;color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.header-inner{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.logo-badge{background:#fff;border-radius:8px;padding:6px;display:flex;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.logo-badge img{height:30px;width:auto;display:block}
.brand h1{font-size:17px;margin:0;line-height:1.2}
.brand .subtitle{font-size:11px;color:#a7f3d0;margin:1px 0 0}
.header-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{background:#047857;border-radius:999px;padding:4px 12px;font-size:11px;white-space:nowrap}
.conn-badge{border-radius:999px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.35);display:inline-flex;align-items:center;gap:6px}
.conn-badge .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.conn-badge.ok{background:#022c22;color:#6ee7b7}
.conn-badge.ok .dot{background:#34d399}
.conn-badge.off{background:#450a0a;color:#fecaca}
.conn-badge.off .dot{background:#f87171}
.conn-badge.demo{background:#1e3a8a;color:#bfdbfe}
.conn-badge.demo .dot{background:#93c5fd}
nav.tabs{max-width:1400px;margin:0 auto;padding:0 20px 8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{display:flex;align-items:center;gap:8px;white-space:nowrap;border:0;background:transparent;color:#d1fae5;padding:8px 16px;font-size:13.5px;border-radius:8px 8px 0 0;cursor:pointer}
nav.tabs button.active{background:#f1f5f9;color:#064e3b;font-weight:600}
nav.tabs button:hover:not(.active){background:#047857}
nav.tabs svg{width:16px;height:16px}
main{max-width:1400px;width:100%;margin:0 auto;flex:1;padding:24px 20px}
.app-footer{border-top:1px solid #e2e8f0;background:#fff;margin-top:auto}
.footer-inner{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;font-size:11.5px;color:#64748b}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:90px 0;color:#64748b}
.spinner{width:18px;height:18px;border:2.5px solid #cbd5e1;border-top-color:#065f46;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hide-sm{display:inline-flex}
@media(max-width:640px){.hide-sm{display:none!important}}

/* ---------- Tombol ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:8px;padding:8px 14px;font-size:13.5px;cursor:pointer;font-weight:500;line-height:1.2;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:0 0 auto}
.btn-primary{background:#065f46;color:#fff}
.btn-primary:hover{background:#064e3b}
.btn-outline{background:#fff;border-color:#cbd5e1;color:#0f172a}
.btn-outline:hover{background:#f8fafc}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-danger-ghost{background:transparent;color:#dc2626}
.btn-danger-ghost:hover{background:#fee2e2}
.btn-ghost{background:transparent}
.btn-ghost:hover{background:rgba(255,255,255,.15)}
.btn-ghost.dark:hover{background:#e2e8f0}
.btn-icon{padding:7px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- Kartu ---------- */
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.card-h{padding:13px 18px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-t{font-size:15px;font-weight:700;margin:0}
.card-b{padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}

.stat{display:flex;gap:14px;align-items:center;padding:18px}
.stat .ic{background:#d1fae5;color:#047857;border-radius:12px;padding:12px;display:flex;flex:0 0 auto}
.stat .ic svg{width:20px;height:20px}
.stat .lb{font-size:11.5px;color:#64748b}
.stat .vl{font-size:16.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Judul halaman ---------- */
.page-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.page-h h2{margin:0;font-size:18px}
.page-h .sub{margin:3px 0 0;font-size:12px;color:#64748b}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Banner ---------- */
.banner{background:#ecfdf5;border:1px solid #6ee7b7;color:#064e3b;border-radius:10px;padding:12px 16px;display:flex;gap:12px;align-items:center;margin-bottom:16px;font-size:13.5px;flex-wrap:wrap}
.banner.err{background:#fef2f2;border-color:#fca5a5;color:#7f1d1d}

/* ---------- Tabel data ---------- */
.tblwrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13.5px}

.empty{text-center:center;text-align:center;color:#64748b;padding:44px 12px!important}

/* ---------- Formulir ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12px;font-weight:600;color:#334155}
.field .hint{font-size:11px;color:#64748b;margin:0}

.ftabs button.active{color:#065f46;font-weight:700;border-bottom-color:#065f46;background:#f0fdf4}

/* ---------- Modal ---------- */

.modal-h h3{margin:0;font-size:16.5px}

/* ---------- Toast ---------- */
#toasts{position:fixed;bottom:18px;right:18px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:#0f172a;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:0 6px 18px rgba(2,6,23,.35);max-width:360px;animation:tin .22s ease-out}

/* ---------- Dokumen view toolbar ---------- */

.doc-toolbar select{width:auto;min-width:230px;max-width:340px}

/* ============================================================

.f4-stage{background:#cbd5e1;border:1px solid #cbd5e1;border-radius:12px;flex:1;overflow:auto;padding:24px}

/* Kop surat */
.kop{display:flex;align-items:center;gap:6mm;border-bottom:3px double #000;padding-bottom:2mm;margin-bottom:4mm}
.kop-logo{flex:0 0 auto}
.kop-logo img{height:98px;width:auto;display:block}
.kop-teks{flex:1 1 auto;text-align:center;font-family:Arial,Helvetica,sans-serif}

/* Umum dokumen */

.pt-2{padding-top:3mm}
.doc-tbl-pihak{border-collapse:collapse;width:100%}

.w-4{width:4mm}.w-8{width:8mm}.w-10{width:10mm}.w-14{width:14mm}.w-18{width:18mm}
.w-20{width:20mm}.w-24{width:24mm}.w-26{width:26mm}.w-28{width:28mm}.w-30{width:30mm}

/* Tanda tangan */
.ttd-row{display:flex;justify-content:space-between;width:100%;gap:10mm}
.ttd-col{flex:1 1 0;text-align:left;min-width:0}

/* Cover */

/* BAP Materai */

<body>

<div class="app-shell">
  <header class="app-header">
    <div class="header-inner">
      <div class="logo-badge"><img id="logo1" alt="Logo Kutai Kartanegara" /></div>
      <div class="brand">
        <h1>eSPJ-Kontribusi</h1>
        <p class="subtitle">Dinas Kesehatan Kabupaten Kutai Kartanegara — SPJ Kontribusi Pelatihan</p>
      </div>
      <div class="header-right">
        <span class="chip hide-sm">Kertas F4 • 215 × 330 mm</span>
        <button class="conn-badge off" id="connBadge" onclick="openConfig()"><span class="dot"></span><span id="connText">Memeriksa…</span></button>
        <button class="btn btn-ghost hide-sm" style="color:#fff" onclick="refreshAll()" title="Muat ulang data" id="btnRefresh"></button>
      </div>
    </div>
    <nav class="tabs" id="nav"></nav>
  </header>

  <main id="main"><div class="loading"><span class="spinner"></span> Memuat data…</div></main>

  <footer class="app-footer">
    <div class="footer-inner">
      <span>eSPJ-Kontribusi — Dinas Kesehatan Kab. Kutai Kartanegara • DAK Non Fisik TA 2026</span>
      <span>Semua dokumen dicetak pada kertas F4 (215 × 330 mm)</span>
    </div>
  </footer>
</div>

<div id="print-root"></div>
<div id="modal-root"></div>
<div id="toasts"></div>

<script>
/* ============================================================
   eSPJ-Kontribusi (statis) — konfigurasi & inti
   ============================================================ */

/* ================== KONFIGURASI SUPABASE ==================
   1) Buat project di https://supabase.com (gratis)
   2) Jalankan file supabase-schema.sql di SQL Editor Supabase
   3) Salin Project URL & anon key dari: Settings -> API
   4) Isi di bawah ini ATAU lewat tombol status koneksi di kanan atas
      (tersimpan otomatis di browser — tidak perlu edit file lagi). */
const SUPABASE_CONFIG = {
  SUPABASE_URL: "",        // contoh: https://abcdefghijklm.supabase.co
  SUPABASE_ANON_KEY: "",   // contoh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
};

const LS_CFG = "espj_supabase_config";
const LS_DEMO = "espj_demo_db_v1";

/* ================== UTIL DASAR ================== */
const $ = (s, el) => (el || document).querySelector(s);
const esc = (v) => String(v ?? "")
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")

const SATUAN = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan",

const HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
const BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

function kata(n) {
  if (n < 20) return SATUAN[n];
  if (n < 100) { const p = Math.floor(n / 10), s = n % 10; return SATUAN[p] + " Puluh" + (s ? " " + SATUAN[s] : ""); }
  if (n < 200) return "Seratus" + (n % 100 ? " " + kata(n % 100) : "");
  if (n < 1000) { const p = Math.floor(n / 100), s = n % 100; return SATUAN[p] + " Ratus" + (s ? " " + kata(s) : ""); }
  if (n < 2000) return "Seribu" + (n % 1000 ? " " + kata(n % 1000) : "");
  if (n < 1000000) { const p = Math.floor(n / 1000), s = n % 1000; return kata(p) + " Ribu" + (s ? " " + kata(s) : ""); }
  if (n < 1000000000) { const p = Math.floor(n / 1000000), s = n % 1000000; return kata(p) + " Juta" + (s ? " " + kata(s) : ""); }
  if (n < 1000000000000) { const p = Math.floor(n / 1000000000), s = n % 1000000000000; return kata(p) + " Miliar" + (s ? " " + kata(s) : ""); }
  const p = Math.floor(n / 1000000000000), s = n % 1000000000000;
  return kata(p) + " Triliun" + (s ? " " + kata(s) : "");
}
function terbilang(n) { n = Math.floor(Math.abs(Number(n) || 0)); if (n === 0) return "Nol"; return kata(n).trim(); }
function fmtNum(n) {
  if (n === null || n === undefined || isNaN(Number(n))) return "-";
  return new Intl.NumberFormat("id-ID", { maximumFractionDigits: 2 }).format(Number(n));
}
function fmtRupiah(n) { return "Rp " + fmtNum(n); }
function terhitung(n) { return fmtRupiah(n) + " (" + terbilang(n) + " Rupiah)"; }

function parseTgl(s) {
  if (!s) return null;
  const t = String(s).trim();
  if (!t) return null;
  const iso = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(t);
  if (iso) return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
  const idn = /^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/.exec(t);
  if (idn) {
    const bIdx = BULAN.findIndex(b => b.toLowerCase() === idn[2].toLowerCase());
    if (bIdx >= 0) return new Date(Number(idn[3]), bIdx, Number(idn[1]));
  }
  return null;
}
function fmtTgl(d) { if (!d || isNaN(d.getTime())) return ""; return d.getDate() + " " + BULAN[d.getMonth()] + " " + d.getFullYear(); }
function isoTgl(s) { const d = parseTgl(s); return d ? d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") : ""; }
function normTgl(s) { const d = parseTgl(s); return d ? fmtTgl(d) : (s ?? ""); }
function terbilangTahun(y) {
  const ribu = Math.floor(y / 1000), sisa = y % 1000;
  let out = terbilang(ribu) + " Ribu";
  if (sisa === 0) return out;
  if (sisa < 100) out += " " + kata(sisa);
  else {
    const ratus = Math.floor(sisa / 100), rest = sisa % 100;
    out += (ratus === 1 ? " Seratus" : " " + SATUAN[ratus] + " Ratus");
    if (rest) out += " " + kata(rest);
  }
  return out;
}
function kalimatTanggal(s) {
  const d = parseTgl(s);
  if (!d) return String(s ?? "").trim();
  return HARI[d.getDay()] + " tanggal " + terbilang(d.getDate()) + " bulan " + BULAN[d.getMonth()] + " tahun " + terbilangTahun(d.getFullYear());
}
function hitungJumlahBiaya(peserta, satuan) { return (Number(peserta) || 0) * (Number(satuan) || 0); }

<script>
/* ============================================================
   Lapisan data: Supabase (online) / Demo lokal (offline)
   ============================================================ */
let sb = null;           // supabase client
let MODE = "demo";       // "supabase" | "demo"
let CFG = { SUPABASE_URL: "", SUPABASE_ANON_KEY: "" };

function loadCfg() {
  try { const raw = localStorage.getItem(LS_CFG); if (raw) CFG = { ...CFG, ...JSON.parse(raw) }; } catch (e) {}
  if (!CFG.SUPABASE_URL) CFG.SUPABASE_URL = SUPABASE_CONFIG.SUPABASE_URL || "";
  if (!CFG.SUPABASE_ANON_KEY) CFG.SUPABASE_ANON_KEY = SUPABASE_CONFIG.SUPABASE_ANON_KEY || "";
}
function saveCfg(url, key) {
  CFG = { SUPABASE_URL: url.trim(), SUPABASE_ANON_KEY: key.trim() };
  localStorage.setItem(LS_CFG, JSON.stringify(CFG));
}
function cfgValid() { return !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && /^https?:\/\//.test(CFG.SUPABASE_URL)); }

function initClient() {
  if (cfgValid() && typeof window.supabase !== "undefined" && window.supabase.createClient) {
    try { sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY); MODE = "supabase"; return; }
    catch (e) { console.error(e); }
  }
  sb = null; MODE = "demo";
}

/* ---------- Toast ---------- */
function toast(title, err, desc) {
  const t = document.createElement("div");
  t.className = "toast" + (err === true ? " err" : err === "ok" ? " ok" : "");
  t.innerHTML = "<b>" + esc(title) + "</b>" + (desc ? "<div style='opacity:.85;font-size:12px;margin-top:2px'>" + esc(desc) + "</div>" : "");
  $("#toasts").appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .3s"; setTimeout(() => t.remove(), 320); }, 3600);
}

/* ---------- Data kegiatan (tanpa participants) ---------- */
const KEG_FIELDS = ["no", "namaDirektur", "vendor", "jabatanVendor", "alamatVendor", "cpVendor",
  "namaKegiatan", "dasarSurat", "noSuratPenawaran", "tglSuratPenawaran", "tglMulai", "tglSelesai",
  "metode", "tempat", "noInvoice", "tglInvoice", "noRekening", "namaBank", "pemilikRekening",
  "noBAP", "tglBAP", "noBAST", "tglBAST", "noBABayar", "tglBABayar", "noBAMaterai", "tglBAMaterai",
  "jumlahPeserta", "biayaSatuan", "peserta", "uraianPembayaran", "ppn", "pph23", "sumberDana", "noSPPA"];
const PART_FIELDS = ["urutan", "nama", "jabatan", "nip", "pangkat", "npwp", "noRekening", "pemilikRekening", "jumlah", "keterangan"];
const emptyKegiatan = () => { const o = { id: "", participants: [] }; KEG_FIELDS.forEach(f => o[f] = (f === "no" || f === "jumlahPeserta" || f === "biayaSatuan" || f === "ppn" || f === "pph23") ? 0 : (f === "metode" ? "Klasikal" : "")); return o; };

/* ---------- Demo (localStorage) ---------- */
function demoDB() {
  let db = null;
  try { db = JSON.parse(localStorage.getItem(LS_DEMO)); } catch (e) {}
  if (!db || !Array.isArray(db.kegiatan)) {
    db = {
      kegiatan: SEED_KEGIATAN.map(k => ({ ...k, id: uid(), participants: (k.participants || []).map(p => ({ ...p, id: uid(), kegiatanId: "" })) })),
      pejabat: SEED_PEJABAT.map(p => ({ ...p, id: uid() })),
      pengaturan: { ...PENGATURAN_DEFAULT }
    };
    db.kegiatan.forEach(k => k.participants.forEach(p => p.kegiatanId = k.id));
    localStorage.setItem(LS_DEMO, JSON.stringify(db));
  }
  if (!db.pengaturan) db.pengaturan = { ...PENGATURAN_DEFAULT };
  if (!Array.isArray(db.pejabat)) db.pejabat = SEED_PEJABAT.map(p => ({ ...p, id: uid() }));
  return db;
}
const demoSave = (db) => localStorage.setItem(LS_DEMO, JSON.stringify(db));

/* ---------- DAL: operasi data seragam ---------- */
const DAL = {
  async loadAll() {
    if (MODE === "supabase") {
      const [rk, rp, rs] = await Promise.all([
        sb.from("kegiatan").select("*, participant(*)").order("no", { ascending: true }),
        sb.from("pejabat").select("*").order("kode", { ascending: true }),
        sb.from("pengaturan").select("*").eq("id", "utama").maybeSingle()
      ]);
      if (rk.error) throw rk.error;
      if (rp.error) throw rp.error;
      if (rs.error && rs.error.code !== "PGRST116") throw rs.error;
      let kegiatan = (rk.data || []).map(k => ({ ...k, participants: (k.participant || []).slice().sort((a, b) => (a.urutan || 0) - (b.urutan || 0)) }));
      let pejabat = rp.data || [];
      let pengaturan = rs.data;
      // Pengaturan otomatis dibuat bila belum ada
      if (!pengaturan) {
        const ins = await sb.from("pengaturan").insert({ ...PENGATURAN_DEFAULT }).select().single();
        pengaturan = ins.error ? { ...PENGATURAN_DEFAULT } : ins.data;
      }
      return { kegiatan, pejabat, pengaturan };
    }
    const db = demoDB();
    return { kegiatan: db.kegiatan.map(k => ({ ...k, participants: (k.participants || []).slice().sort((a, b) => (a.urutan || 0) - (b.urutan || 0)) })), pejabat: db.pejabat.slice(), pengaturan: { ...db.pengaturan } };
  },

  async saveKegiatan(k) {
    const rec = {}; KEG_FIELDS.forEach(f => rec[f] = k[f] ?? (f.match(/^(no|jumlahPeserta|biayaSatuan|ppn|pph23)$/) ? 0 : ""));
    rec.updatedAt = new Date().toISOString();
    let id = k.id;
    if (MODE === "supabase") {
      if (id) {
        const r = await sb.from("kegiatan").update(rec).eq("id", id).select().single();
        if (r.error) throw r.error;
      } else {
        id = uid();
        const r = await sb.from("kegiatan").insert({ ...rec, id }).select().single();
        if (r.error) throw r.error;
      }
      await sb.from("participant").delete().eq("kegiatanId", id);
      const parts = (k.participants || []).map((p, i) => {
        const pr = { kegiatanId: id, urutan: i + 1 }; PART_FIELDS.forEach(f => pr[f] = p[f] ?? (f === "urutan" || f === "jumlah" ? 0 : ""));
        return { ...pr, id: p.id || uid() };
      });
      if (parts.length) { const ri = await sb.from("participant").insert(parts).select(); if (ri.error) throw ri.error; }
      return { ...r.data, id, participants: parts };
    }
    const db = demoDB();
    if (id) {
      const i = db.kegiatan.findIndex(x => x.id === id);
      if (i >= 0) db.kegiatan[i] = { ...db.kegiatan[i], ...rec, participants: (k.participants || []).map((p, j) => ({ ...p, id: p.id || uid(), kegiatanId: id, urutan: j + 1 })) };
    } else {
      id = uid();
      db.kegiatan.push({ ...rec, id, participants: (k.participants || []).map((p, j) => ({ ...p, id: p.id || uid(), kegiatanId: id, urutan: j + 1 })) });
    }
    demoSave(db);
    return db.kegiatan.find(x => x.id === id);
  },

  async deleteKegiatan(id) {
    if (MODE === "supabase") {
      const r = await sb.from("kegiatan").delete().eq("id", id);
      if (r.error) throw r.error;
      return;
    }
    const db = demoDB();
    db.kegiatan = db.kegiatan.filter(x => x.id !== id);
    demoSave(db);
  },

  async savePengaturan(s) {
    if (MODE === "supabase") {
      const r = await sb.from("pengaturan").upsert({ ...s, id: "utama" }).select().single();
      if (r.error) throw r.error;
      return r.data;
    }
    const db = demoDB(); db.pengaturan = { ...s, id: "utama" }; demoSave(db); return db.pengaturan;
  },

  async savePejabat(list) {
    if (MODE === "supabase") {
      const rows = list.map(p => ({ kode: p.kode, nama: p.nama, nip: p.nip, jabatan: p.jabatan, jabatanPanjang: p.jabatanPanjang }));
      const r = await sb.from("pejabat").upsert(rows, { onConflict: "kode" }).select();
      if (r.error) throw r.error;
      return r.data;
    }
    const db = demoDB(); db.pejabat = list.map(p => ({ ...p })); demoSave(db); return db.pejabat;
  },

  async seedAwal() {
    if (MODE === "supabase") {
      // Pengaturan
      await sb.from("pengaturan").upsert({ ...PENGATURAN_DEFAULT });
      // Pejabat (idempoten per kode)
      await sb.from("pejabat").upsert(SEED_PEJABAT.map(p => ({ ...p })), { onConflict: "kode" });
      // Kegiatan: hanya bila tabel masih kosong
      const cek = await sb.from("kegiatan").select("id").limit(1);
      if (cek.error) throw cek.error;
      if ((cek.data || []).length === 0) {
        for (const k of SEED_KEGIATAN) {
          const id = uid();
          const { participants, ...rest } = k;
          const r = await sb.from("kegiatan").insert({ ...rest, id }).select().single();
          if (r.error) throw r.error;
          if (participants.length) {
            await sb.from("participant").insert(participants.map((p, i) => ({ ...p, id: uid(), kegiatanId: id, urutan: i + 1 })));
          }
        }
      }
      return;
    }
    localStorage.removeItem(LS_DEMO);
  }
};

/* ============================================================
   STATE APLIKASI
   ============================================================ */
const state = {
  view: (location.hash || "#dashboard").replace("#", "") || "dashboard",
  kegiatan: [], pejabat: [], pengaturan: null,
  loading: true, booted: false,
  docKey: "bap", kegiatanId: "", zoom: 0.85,
  editing: null,      // id kegiatan yang diedit (null = tambah)
  hapusId: null
};
const NAV = [
  { key: "dashboard", label: "Dashboard", icon: "dashboard" },
  { key: "data", label: "Data Pelatihan", icon: "list" },
  { key: "dokumen", label: "Dokumen SPJ (F4)", icon: "file" },
  { key: "pengaturan", label: "Pejabat & Pengaturan", icon: "settings" }
];
const byId = (id) => state.kegiatan.find(x => x.id === id);
const currentKegiatan = () => byId(state.kegiatanId) || state.kegiatan[0] || null;

function setConnBadge() {
  const b = $("#connBadge"), t = $("#connText");
  if (!b) return;
  if (MODE === "supabase") { b.className = "conn-badge ok"; t.textContent = "Supabase terhubung"; }
  else if (cfgValid()) { b.className = "conn-badge off"; t.textContent = "Koneksi gagal — klik"; }
  else { b.className = "conn-badge demo"; t.textContent = "Mode Demo (tanpa Supabase)"; }
}

function renderNav() {
  $("#nav").innerHTML = NAV.map(n =>
    '<button class="' + (state.view === n.key ? "active" : "") + '" onclick="goView(\'' + n.key + '\')">' + IC(n.icon) + esc(n.label) + "</button>"
  ).join("");
}
function goView(v) { state.view = v; location.hash = v; renderNav(); renderView(); }
window.addEventListener("hashchange", () => {
  const v = (location.hash || "#dashboard").replace("#", "");
  if (v !== state.view && NAV.some(n => n.key === v)) { state.view = v; renderNav(); renderView(); }
});

function renderView() {
  const m = $("#main");
  syncPrintRoot();
  if (state.view === "dashboard") return renderDashboard(m);
  if (state.view === "data") return renderDataList(m);
  if (state.view === "dokumen") return renderDokumen(m);
  if (state.view === "pengaturan") return renderPengaturan(m);
}

async function refreshAll(silent) {
  try {
    const { kegiatan, pejabat, pengaturan } = await DAL.loadAll();
    state.kegiatan = kegiatan; state.pejabat = pejabat; state.pengaturan = pengaturan;
    if (state.kegiatanId && !byId(state.kegiatanId)) state.kegiatanId = "";
    setConnBadge();
    if (!silent) renderView();
  } catch (e) {
    console.error(e);
    setConnBadge();
    const m = $("#main");
    m.innerHTML = '<div class="banner err">' + IC("alert") + '<div class="grow"><b>Gagal memuat data dari Supabase.</b><br>' + esc(e.message || String(e)) +
      '<br>Periksa URL & anon key, lalu pastikan supabase-schema.sql sudah dijalankan.</div><button class="btn btn-outline" onclick="openConfig()">Perbaiki Koneksi</button></div>' +
      '<div class="card"><div class="card-b" style="text-align:center;color:#64748b">Atau coba <button class="btn btn-primary" onclick="location.reload()">Muat Ulang</button></div></div>';
  }
}

async function boot() {
  loadCfg(); initClient(); setConnBadge();
  $("#btnRefresh").innerHTML = IC("refresh");
  renderNav();
  await refreshAll(true);
  state.loading = false;
  state.booted = true;
  renderView();
}
</script>

<script>
/* ============================================================
   TAMPILAN: Dashboard, Data Pelatihan, Form, Pengaturan, Modal
   ============================================================ */

/* ---------- Dashboard ---------- */
function renderDashboard(m) {
  const ks = state.kegiatan;
  const totalNilai = ks.reduce((a, k) => a + hitungJumlahBiaya(k.jumlahPeserta, k.biayaSatuan), 0);
  const totalPeserta = ks.reduce((a, k) => a + (Number(k.jumlahPeserta) || 0), 0);
  const totalPph = ks.reduce((a, k) => a + (Number(k.pph23) > 0 ? Number(k.pph23) : hitungPPh23(hitungJumlahBiaya(k.jumlahPeserta, k.biayaSatuan))), 0);
  const stats = [
    { label: "Kegiatan Pelatihan", value: String(ks.length), icon: "stack" },
    { label: "Total Nilai Kontribusi", value: fmtRupiah(totalNilai), icon: "wallet" },
    { label: "Jumlah Peserta", value: fmtNum(totalPeserta) + " orang", icon: "users" },
    { label: "Total PPh 23", value: fmtRupiah(totalPph), icon: "percent" }
  ];
  const seedBanner = ks.length === 0 ? '<div class="banner">' + IC("db") + '<div class="grow"><b>Belum ada data pelatihan.</b> Muat 5 kegiatan contoh dari file Excel untuk melihat seluruh dokumen, atau mulai isi formulir sendiri.</div>' +
    '<button class="btn btn-primary" onclick="seedAwalClick()">' + IC("db") + ' Isi Data Awal</button><button class="btn btn-outline" onclick="openForm(null)">' + IC("plus") + ' Tambah Kegiatan</button></div>' : "";
  const rows = ks.map(k => {
    const baLengkap = k.noBAP && k.noBAST && k.noBABayar && k.noBAMaterai && k.tglBAP && k.tglBAST;
    return '<tr>' +
      '<td>' + esc(k.no) + '</td>' +
      '<td><div class="ellipsis" style="font-weight:600" title="' + esc(k.namaKegiatan) + '">' + esc(k.namaKegiatan) + '</div><div class="subtext">' + esc(k.metode) + " • " + esc(k.tempat) + "</div></td>" +
      '<td class="subtext" style="max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(k.vendor) + "</td>" +
      '<td class="subtext" style="white-space:nowrap">' + esc(normTgl(k.tglMulai)) + " — " + esc(normTgl(k.tglSelesai)) + "</td>" +
      '<td class="num">' + esc(fmtRupiah(hitungJumlahBiaya(k.jumlahPeserta, k.biayaSatuan))) + "</td>" +
      '<td>' + (baLengkap ? '<span class="badge ok">' + IC("check") + " Lengkap</span>" : '<span class="badge warn">' + IC("alert") + " Proses</span>") + "</td>" +
      '<td><div class="row-actions"><button class="btn btn-ghost dark btn-icon" title="Ubah" onclick="openForm(\'' + k.id + '\')">' + IC("pencil") + '</button></div></td>' +
      "</tr>";
  }).join("");
  m.innerHTML = seedBanner +
    '<div class="stats">' + stats.map(s => '<div class="card stat"><div class="ic">' + IC(s.icon) + '</div><div style="min-width:0"><div class="lb">' + esc(s.label) + '</div><div class="vl">' + esc(s.value) + "</div></div></div>").join("") + "</div>" +
    '<div class="card"><div class="card-h"><h3 class="card-t">Data Pelatihan Terkini</h3><button class="btn btn-primary" onclick="goView(\'dokumen\')">' + IC("file") + " Buka Dokumen SPJ</button></div>" +
    '<div class="card-b" style="padding:0"><div class="tblwrap"><table class="data"><thead><tr><th>No</th><th>Kegiatan</th><th>Vendor</th><th>Periode</th><th style="text-align:right">Nilai</th><th>Kelengkapan BA</th><th></th></tr></thead><tbody>' +
    (ks.length === 0 ? '<tr><td colspan="7" class="empty">Belum ada data pelatihan.</td></tr>' : rows) +
    "</tbody></table></div></div></div>";
}

    '<div class="page-actions"><button class="btn btn-primary" onclick="openForm(null)">' + IC("plus") + " Tambah Kegiatan</button></div></div>" + seedBanner +

/* ---------- Modal hapus ---------- */
function openHapus(id) {
  const k = byId(id); if (!k) return;
  state.hapusId = id;
  showModal("sm",
    "<h3>Hapus kegiatan?</h3>",
    '<p style="margin:0 0 6px;color:#475569;font-size:13.5px">"' + esc(k.namaKegiatan.slice(0, 90)) + (k.namaKegiatan.length > 90 ? "…" : "") +
    '" beserta daftar peserta penggantiannya akan dihapus permanen.</p>',
    '<button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-danger" onclick="doHapus()">' + IC("trash") + " Hapus</button>");
}
async function doHapus() {
  try { await DAL.deleteKegiatan(state.hapusId); closeModal(); toast("Terhapus", "ok", "Data kegiatan berhasil dihapus."); await refreshAll(); }
  catch (e) { console.error(e); toast("Gagal menghapus", true, e.message); }
}

/* ---------- Isi data awal ---------- */
async function seedAwalClick() {
  try {
    await DAL.seedAwal();
    await refreshAll(true);
    renderView();
    toast("Data awal dimuat", "ok", "5 kegiatan, 6 pejabat, dan pengaturan instansi siap dipakai.");
  } catch (e) { console.error(e); toast("Gagal mengisi data awal", true, e.message); }
}

/* ---------- Modal kerangka ---------- */
function showModal(size, head, body, footer, wideBody) {
  $("#modal-root").innerHTML = '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal ' + (size || "") + '">' +
    '<div class="modal-h">' + head + "</div>" +
    '<div class="modal-b">' + body + "</div>" +
    (footer ? '<div class="modal-f">' + footer + "</div>" : "") +
    "</div></div>";
}
function closeModal() { $("#modal-root").innerHTML = ""; }

/* ---------- Modal konfigurasi Supabase ---------- */
function openConfig() {
  showModal("md",
    "<h3>Koneksi Backend Supabase</h3><p>Salin dari Supabase Dashboard: <b>Project Settings → API</b> (Project URL & anon public key). Tersimpan di browser ini saja.</p>",
    '<div class="field" style="margin-bottom:12px"><label>Project URL</label><input id="cfgUrl" type="url" placeholder="https://xxxxx.supabase.co" value="' + esc(CFG.SUPABASE_URL) + '"></div>' +
    '<div class="field"><label>Anon Public Key</label><textarea id="cfgKey" style="min-height:84px;font-family:monospace;font-size:11.5px" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">' + esc(CFG.SUPABASE_ANON_KEY) + "</textarea></div>" +
    '<div class="notebox" style="margin-top:12px">Jangan lupa jalankan <b>supabase-schema.sql</b> pada SQL Editor Supabase agar tabel kegiatan/participant/pejabat/pengaturan terbentuk.</div>',
    '<button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-outline" onclick="clearCfg()">Hapus Konfigurasi</button><button class="btn btn-primary" onclick="saveCfgClick()">' + IC("save") + " Simpan & Uji</button>");
}
function clearCfg() { localStorage.removeItem(LS_CFG); CFG = { SUPABASE_URL: "", SUPABASE_ANON_KEY: "" }; closeModal(); toast("Konfigurasi dihapus", "ok", "Aplikasi kembali ke Mode Demo."); location.reload(); }
async function saveCfgClick() {
  const url = $("#cfgUrl").value.trim(), key = $("#cfgKey").value.trim();
  if (!url || !key) { toast("Lengkapi URL dan anon key", true); return; }
  saveCfg(url, key);
  initClient();
  if (MODE !== "supabase") { setConnBadge(); toast("Supabase SDK belum termuat", true, "Periksa koneksi internet lalu muat ulang halaman."); return; }
  try {
    const t = await sb.from("kegiatan").select("id").limit(1);
    if (t.error) throw t.error;
    closeModal(); toast("Terhubung ke Supabase", "ok");
    await refreshAll();
  } catch (e) {
    console.error(e); setConnBadge();
    toast("Tersimpan, namun uji akses gagal", true, (e.message || "") + " — pastikan schema sudah dijalankan.");
    await refreshAll();
  }
}

/* ---------- Formulir Data Pelatihan (6 tab) ---------- */
let FORM = null; // { data, tab }
function openForm(id) {
  const base = id ? byId(id) : null;
  const data = base ? JSON.parse(JSON.stringify(base)) : emptyKegiatan();
  // Tanggal tampil ISO pada input date bila dapat diparse
  ["tglSuratPenawaran", "tglMulai", "tglSelesai", "tglInvoice", "tglBAP", "tglBAST", "tglBABayar", "tglBAMaterai"].forEach(f => { const iso = isoTgl(data[f]); if (iso) data[f] = iso; });
  FORM = { data, tab: "kegiatan" };
  renderForm();
}
function fmModalHead() {
  return "<h3>" + (FORM.data.id ? "Ubah Data Pelatihan" : "Tambah Data Pelatihan") + "</h3>" +
    '<p>Formulir ini menggantikan sheet "Data Pelatihan". Seluruh dokumen SPJ akan terisi otomatis dari data di sini.</p>';
}
function fmTabs() {
  const tabs = [["kegiatan", "1. Kegiatan"], ["vendor", "2. Vendor"], ["invoice", "3. Invoice & Rekening"], ["ba", "4. Berita Acara"], ["nilai", "5. Nilai & Pajak"], ["peserta", "6. Peserta Penggantian"]];
  return '<div class="ftabs">' + tabs.map(t => '<button class="' + (FORM.tab === t[0] ? "active" : "") + '" onclick="FORM.tab=\'' + t[0] + '\';renderForm()">' + esc(t[1]) + "</button>").join("") + "</div>";
}
const fld = (label, inner, hint) => '<div class="field"><label>' + label + "</label>" + inner + (hint ? '<p class="hint">' + hint + "</p>" : "") + "</div>";
const inp = (path, type, extra) => '<input type="' + (type || "text") + '" oninput="formSet(\'' + path + '\', this.value)" ' + (extra || "") + ">";

function renderForm() {
  const f = FORM.data;
  const jumlahBiaya = hitungJumlahBiaya(f.jumlahPeserta, f.biayaSatuan);
  const pph23Auto = hitungPPh23(jumlahBiaya);
  const pph23Shown = Number(f.pph23) > 0 ? Number(f.pph23) : pph23Auto;
  let pane = "";

  if (FORM.tab === "kegiatan") {
    pane = '<div class="grid2">' +
      fld("Nama Kegiatan / Pelatihan *", '<textarea oninput="formSet(\'namaKegiatan\', this.value)" placeholder="Pelatihan ...">' + esc(f.namaKegiatan) + "</textarea>") +
      fld("Dasar Surat", '<textarea oninput="formSet(\'dasarSurat\', this.value)" placeholder="Surat Penawaran Program Pelatihan Nomor : ...">' + esc(f.dasarSurat) + "</textarea>") +
      fld("Nomor Surat Penawaran", inp("noSuratPenawaran")) +
      fld("Tanggal Surat Penawaran", '<input type="date" oninput="formSet(\'tglSuratPenawaran\', this.value)" value="' + esc(f.tglSuratPenawaran) + '">', '<span id="pvtglSuratPenawaran">' + esc(normTgl(f.tglSuratPenawaran) || "—") + "</span>") +
      fld("Tanggal Mulai", '<input type="date" oninput="formSet(\'tglMulai\', this.value)" value="' + esc(f.tglMulai) + '">', '<span id="pvtglMulai">' + esc(normTgl(f.tglMulai) || "—") + "</span>") +
      fld("Tanggal Selesai", '<input type="date" oninput="formSet(\'tglSelesai\', this.value)" value="' + esc(f.tglSelesai) + '">', '<span id="pvtglSelesai">' + esc(normTgl(f.tglSelesai) || "—") + "</span>") +
      fld("Metode", '<select onchange="formSet(\'metode\', this.value)">' + ["Klasikal", "Blended Learning", "e-Learning"].map(m => '<option ' + (f.metode === m ? "selected" : "") + ">" + m + "</option>").join("") + "</select>") +
      fld("Tempat Pelaksanaan", inp("tempat", "text", 'placeholder="Hotel / Bapelkes ..."')) +
      fld("Sumber Dana", inp("sumberDana")) +
      fld("Nomor SP PA", inp("noSPPA")) +
      "</div>";
  } else if (FORM.tab === "vendor") {
    pane = '<div class="grid2">' +
      fld("Nama Direktur / Pimpinan", inp("namaDirektur")) +
      fld("Pelaksana / Pihak Ke-3 / Vendor", inp("vendor")) +
      fld("Jabatan (kontak vendor)", inp("jabatanVendor")) +
      fld("Contact Person", inp("cpVendor")) +
      fld("Alamat", '<textarea style="min-height:70px" oninput="formSet(\'alamatVendor\', this.value)">' + esc(f.alamatVendor) + "</textarea>", "Digunakan pada seluruh dokumen sebagai alamat Pihak Kedua.") +
      "</div>";
  } else if (FORM.tab === "invoice") {
    pane = '<div class="grid2">' +
      fld("Nomor Invoice", inp("noInvoice")) +
      fld("Tanggal Invoice", '<input type="date" oninput="formSet(\'tglInvoice\', this.value)" value="' + esc(f.tglInvoice) + '">') +
      fld("Nomor Rekening", inp("noRekening")) +
      fld("Nama Bank", inp("namaBank")) +
      fld("Nama Pemilik Rekening", inp("pemilikRekening")) +
      "</div>";
  } else if (FORM.tab === "ba") {
    const bas = [["BAP", "BA Pemeriksaan Pekerjaan"], ["BAST", "BA Serah Terima Pekerjaan"], ["BABayar", "BA Pembayaran"], ["BAMaterai", "BA Pembayaran Bermaterai"]];
    pane = '<div class="grid2">' + bas.map(b => {
      const kal = kalimatTanggal(f["tgl" + b[0]]) || "—";
      return '<div class="bacard"><div class="t">' + esc(b[1]) + "</div>" +
      '<input type="text" placeholder="Nomor ' + esc(b[1]) + '" value="' + esc(f["no" + b[0]]) + '" oninput="formSet(\'no' + b[0] + '\', this.value)" style="margin-bottom:6px">' +
      '<input type="date" value="' + esc(f["tgl" + b[0]]) + '" oninput="formSet(\'tgl' + b[0] + '\', this.value)">' +
      '<p class="hint" style="font-style:italic;margin-top:6px" id="kal' + b[0] + '">Kalimat otomatis: ' + esc(kal) + "</p></div>";
    }).join("") + "</div>" +
      '<p class="hint" style="margin-top:10px">Kosongkan tanggal bila berita acara belum terbit — dokumen menampilkan titik-titik isian. Nomor dapat diisi bertahap (mis. "B-&nbsp;&nbsp;&nbsp;&nbsp;/DINKES/SDK-SDMK/400.3.8.3/9/2026").</p>';
  } else if (FORM.tab === "nilai") {
    const uraianAuto = templateUraianPembayaran(f);
    pane = '<div class="grid2">' +
      fld("Jumlah Peserta", '<input type="number" min="0" value="' + esc(f.jumlahPeserta) + '" oninput="formSetNum(\'jumlahPeserta\', this.value)">') +
      fld("Biaya Satuan (Rp)", '<input type="number" min="0" value="' + esc(f.biayaSatuan) + '" oninput="formSetNum(\'biayaSatuan\', this.value)">') +
      fld("Jumlah Biaya (otomatis)", '<div class="auto-box" style="font-weight:700" id="pvBiaya">' + esc(fmtRupiah(jumlahBiaya)) + "</div>") +
      fld("Terbilang (otomatis)", '<div class="auto-box" id="pvTerhitung">' + esc(terhitung(jumlahBiaya)) + "</div>") +
      fld("Peserta / an. (nama penerima kontribusi)", inp("peserta")) +
      fld("PPn (Rp)", '<input type="number" min="0" value="' + esc(f.ppn) + '" oninput="formSetNum(\'ppn\', this.value)">') +
      fld("PPh 23 (otomatis " + esc(fmtRupiah(pph23Auto)) + " bila dikosongkan)", '<input type="number" min="0" step="0.01" value="' + esc(f.pph23) + '" oninput="formSetNum(\'pph23\', this.value)">', 'Kosongkan/0 untuk otomatis: ' + esc(fmtRupiah(pph23Auto))) +
      fld("Uraian Pembayaran / Kwitansi", '<textarea style="min-height:80px" placeholder="' + esc(uraianAuto) + '" oninput="formSet(\'uraianPembayaran\', this.value)">' + esc(f.uraianPembayaran) + "</textarea>", "Dikosongkan akan dibuat otomatis dari template resmi.") +
      "</div>" +
      '<div class="notebox" style="margin-top:12px"><b>Pratinjau uraian otomatis:</b> <span id="pvUraian">' + esc(uraianAuto) + "</span><br><b>Terbilang:</b> <span id=\"pvTerbilang\">" + esc(terbilang(jumlahBiaya)) + " Rupiah</span></div>";
  } else {
    const parts = f.participants || [];
    pane = '<p class="hint" style="margin:0 0 10px">Daftar peserta penerima penggantian biaya kontribusi bimtek — digunakan pada dokumen "Daftar Pembayaran Penggantian Uang".</p>' +
      '<div id="plist">' + parts.map((p, i) => pRow(p, i)).join("") + "</div>" +
      '<button class="btn btn-outline" onclick="addPart()">' + IC("plus") + " Tambah Peserta</button>";
  }

  showModal("", fmModalHead(), fmTabs() + '<div class="fpane active">' + pane + "</div>",
    '<button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveForm()">' + IC("save") + " Simpan</button>");
}
function pRow(p, i) {
  const c = (k, label, type) => '<div class="field"><label>' + label + '</label><input type="' + (type || "text") + '" value="' + esc(p[k]) + '" oninput="updPart(' + i + ',\'' + k + '\', this.value)"></div>';
  return '<div class="pcard">' +
    c("nama", "Nama") + c("jabatan", "Jabatan") + c("nip", "NIP") + c("pangkat", "Pangkat/Golongan") +
    c("npwp", "NPWP") + c("noRekening", "Nomor Rekening") + c("pemilikRekening", "Nama Pemilik Rekening") +
    c("jumlah", "Jumlah Ditransfer", "number") + c("keterangan", "Keterangan (Bank)") +
    '<div class="del"><button class="btn btn-danger-ghost" onclick="delPart(' + i + ')">' + IC("trash") + " Hapus</button></div></div>";
}
function formSet(path, v) {
  FORM.data[path] = v;
  if (path.startsWith("tgl")) {
    const pv = document.getElementById("pv" + path);
    if (pv) pv.textContent = normTgl(v) || "—";
    const kal = document.getElementById("kal" + path.replace("tgl", ""));
    if (kal) kal.textContent = "Kalimat otomatis: " + (kalimatTanggal(v) || "—");
  }
}
function formSetNum(path, v) {
  FORM.data[path] = Number(v) || 0;
  if (FORM.tab === "nilai") {
    const f = FORM.data;
    const jumlahBiaya = hitungJumlahBiaya(f.jumlahPeserta, f.biayaSatuan);
    const pph23Auto = hitungPPh23(jumlahBiaya);
    const nb = document.getElementById("pvBiaya"); if (nb) nb.textContent = fmtRupiah(jumlahBiaya);
    const nt = document.getElementById("pvTerhitung"); if (nt) nt.textContent = terhitung(jumlahBiaya);
    const nu = document.getElementById("pvUraian"); if (nu) nu.textContent = templateUraianPembayaran(f);
    const ng = document.getElementById("pvTerbilang"); if (ng) ng.textContent = terbilang(jumlahBiaya) + " Rupiah";
  }
}
function updPart(i, k, v) { if (!FORM.data.participants) FORM.data.participants = []; FORM.data.participants[i][k] = (k === "jumlah") ? (Number(v) || 0) : v; }
function addPart() { if (!FORM.data.participants) FORM.data.participants = []; FORM.data.participants.push({ nama: "", jabatan: "", nip: "", pangkat: "", npwp: "", noRekening: "", pemilikRekening: "", jumlah: 0, keterangan: "Bankaltimtara", urutan: 0 }); FORM.tab = "peserta"; renderForm(); }
function delPart(i) { FORM.data.participants.splice(i, 1); renderForm(); }

async function saveForm() {
  const f = FORM.data;
  if (!String(f.namaKegiatan || "").trim() || !String(f.vendor || "").trim()) {
    toast("Data belum lengkap", true, "Nama Kegiatan dan Vendor wajib diisi.");
    FORM.tab = "kegiatan"; renderForm(); return;
  }
  const jumlahBiaya = hitungJumlahBiaya(f.jumlahPeserta, f.biayaSatuan);
  f.pph23 = Number(f.pph23) > 0 ? Number(f.pph23) : hitungPPh23(jumlahBiaya);
  try {
    const saved = await DAL.saveKegiatan(f);
    const ada = state.kegiatan.some(x => x.id === saved.id);
    state.kegiatan = ada ? state.kegiatan.map(x => x.id === saved.id ? saved : x) : [...state.kegiatan, saved].sort((a, b) => (a.no || 0) - (b.no || 0));
    closeModal();
    toast("Tersimpan", "ok", 'Kegiatan "' + String(saved.namaKegiatan).slice(0, 60) + '..." berhasil disimpan.');
    syncPrintRoot();
    renderView();
  } catch (e) { console.error(e); toast("Gagal menyimpan", true, e.message || String(e)); }
}
</script>

<script>
/* ============================================================
   TAMPILAN: Pejabat & Pengaturan
   ============================================================ */
let SETT = null, PEJ = null;
function renderPengaturan(m) {

    fld("Tahun Anggaran", si("tahunAnggaran", SETT.tahunAnggaran)) + fld("Label Anggaran (Cover)", si("anggaranLabel", SETT.anggaranLabel)) +
    "</div></div></div>" +

    fld("Program", si("program", SETT.program)) +

    fld("Kode Rekening", si("kodeRekening", SETT.kodeRekening)) + fld("Uraian Kode Rekening", si("uraianKodeRekening", SETT.uraianKodeRekening)) +
    fld("Nomor DPA", si("noDPA", SETT.noDPA)) + fld("Lokasi Pekerjaan", si("lokasiPekerjaan", SETT.lokasiPekerjaan)) +

    fld("Dasar SK KPA (teks panjang dokumen)", ta("skKPA", SETT.skKPA, 70)) +

}
function settSet(path, v) { SETT[path] = v; }
function pejSet(i, k, v) { PEJ[i][k] = v; }
async function savePengaturanClick() {
  try {
    state.pengaturan = await DAL.savePengaturan(SETT);
    state.pejabat = await DAL.savePejabat(PEJ);
    toast("Tersimpan", "ok", "Pengaturan & pejabat berhasil diperbarui.");
    syncPrintRoot();
  } catch (e) { console.error(e); toast("Gagal menyimpan", true, e.message || String(e)); }
}

/* ============================================================
   TAMPILAN: Dokumen SPJ (pratinjau F4 + cetak)
   ============================================================ */
function buildDocData(k, s, pejabat) {
  const pj = {}; (pejabat || []).forEach(p => pj[p.kode] = p);
  const jumlahBiaya = hitungJumlahBiaya(k.jumlahPeserta, k.biayaSatuan);
  const pph23 = Number(k.pph23) > 0 ? Number(k.pph23) : hitungPPh23(jumlahBiaya);
  const ppn = Number(k.ppn) || 0;
  const setelahPotongan = jumlahBiaya - ppn - pph23;
  return {
    k, s, kpa: pj["KPA"], pptk: pj["PPTK"], bp: pj["BP"], bpp: pj["BPP"], verifikator: pj["VERIFIKATOR"], pphp: pj["PPHP"],
    jumlahBiaya, ppn, pph23, setelahPotongan,
    terbilangBiaya: terbilang(jumlahBiaya) + " Rupiah",
    terhitungBiaya: "Rp " + fmtNum(jumlahBiaya) + " (" + terbilang(jumlahBiaya) + " Rupiah)",
    kalimatBAP: k.tglBAP ? kalimatTanggal(k.tglBAP) : "",
    kalimatBAST: k.tglBAST ? kalimatTanggal(k.tglBAST) : "",
    kalimatBABayar: k.tglBABayar ? kalimatTanggal(k.tglBABayar) : "",
    kalimatBAMaterai: k.tglBAMaterai ? kalimatTanggal(k.tglBAMaterai) : "",
    uraianPembayaran: k.uraianPembayaran ? k.uraianPembayaran : templateUraianPembayaran(k),
    uraianKontrak: templateUraianKontrak(k),
    uraianPekerjaan: templateUraianPekerjaan(k),
    periode: normTgl(k.tglMulai) + " s/d " + normTgl(k.tglSelesai),
    tanggalPengeluaran: normTgl(k.tglBABayar) || normTgl(k.tglBAMaterai) || normTgl(k.tglBAP)
  };
}

const DOC_RENDER = { cover: docCover, bap: docBAP, bast: docBAST, baBayar: docBABayar, baMaterai: docBAMaterai, buktiPengeluaran: docBuktiPengeluaran, disposisi: docDisposisi, daftarPembayaran: docDaftarPembayaran, pernyataanPA: docPernyataanPA };

function renderDokumen(m) {
  const k = currentKegiatan();
  const doc = DOC_LIST.find(x => x.key === state.docKey) || DOC_LIST[1];
  const opts = state.kegiatan.map(x => '<option value="' + x.id + '"' + (k && x.id === k.id ? " selected" : "") + ">" + esc(x.no) + ". " + esc(x.namaKegiatan.length > 46 ? x.namaKegiatan.slice(0, 46) + "…" : x.namaKegiatan) + "</option>").join("");
  const docOpts = DOC_LIST.map(x => '<option value="' + x.key + '"' + (x.key === state.docKey ? " selected" : "") + ">" + esc(x.nama) + "</option>").join("");
  const empty = !k;
  m.innerHTML = '<div class="doc-toolbar">' +
    '<select onchange="state.kegiatanId=this.value;renderView()">' + (opts || '<option value="">— Belum ada kegiatan —</option>') + "</select>" +
    '<select onchange="state.docKey=this.value;renderView()">' + docOpts + "</select>" +
    '<button class="btn btn-primary" onclick="window.print()" ' + (empty ? "disabled" : "") + ">" + IC("printer") + " Cetak F4</button>" +
    '<div class="zoombox"><button class="btn btn-outline btn-icon" onclick="zoomStep(-0.1)" title="Perkecil">' + IC("zout") + '</button><span class="pct">' + Math.round(state.zoom * 100) + '%</span><button class="btn btn-outline btn-icon" onclick="zoomStep(0.1)" title="Perbesar">' + IC("zin") + "</button></div></div>" +
    '<div class="doc-info">' + IC("file") + "<span><b>" + esc(doc.nama) + "</b> — " + esc(doc.deskripsi) + " Sumber: " + esc(doc.sumber) + ". Ukuran kertas: <b>F4 " + (doc.orientasi === "portrait" ? "215 × 330 mm (tegak)" : "330 × 215 mm (mendatar)") + "</b>.</span></div>" +
    (empty ? '<div class="banner">' + IC("alert") + '<div class="grow">Belum ada data kegiatan. Tambahkan melalui menu <b>Data Pelatihan</b>.</div><button class="btn btn-primary" onclick="goView(\'data\')">Buka Data Pelatihan</button></div>' : "") +
    '<div class="f4-stage"><div class="zoom-wrap" style="transform:scale(' + state.zoom + ');transform-origin:top center;width:' + (doc.orientasi === "landscape" ? 330 : 215) * 3.7795 + 'px;height:' + (doc.orientasi === "landscape" ? 215 : 330) * 3.7795 + 'px;max-width:none">' +
    (empty ? "" : '<div class="f4-sheet' + (doc.orientasi === "landscape" ? " landscape" : "") + '">' + renderCurrentDoc() + "</div>") +
    "</div></div>";
}
function renderCurrentDoc() {
  const k = currentKegiatan();
  if (!k) return "";
  const d = buildDocData(k, state.pengaturan || PENGATURAN_DEFAULT, state.pejabat);
  return (DOC_RENDER[state.docKey] || DOC_RENDER.bap)(d);
}
function zoomStep(z) { state.zoom = Math.min(1.5, Math.max(0.4, state.zoom + z)); renderView(); }

/** Isi area cetak (muncul hanya saat window.print()) */
function syncPrintRoot() {
  const root = $("#print-root");
  if (!root) return;
  const k = currentKegiatan();
  const doc = DOC_LIST.find(x => x.key === state.docKey) || DOC_LIST[1];
  if (!k) { root.innerHTML = ""; document.body.classList.remove("print-landscape"); return; }
  document.body.classList.toggle("print-landscape", doc.orientasi === "landscape");
  root.className = "";
  root.innerHTML = '<div class="f4-sheet' + (doc.orientasi === "landscape" ? " landscape" : "") + '">' + renderCurrentDoc() + "</div>";
}
